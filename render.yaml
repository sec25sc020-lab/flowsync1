services:
  - type: web
    name: flowsync1-sec25sc020-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: FLOWSYNC_DB
        value: /tmp/flowsync.db
      - key: FLOWSYNC_ADMIN_PASSWORD
        generateValue: true
      - key: FLOWSYNC_OPERATOR_PASSWORD
        generateValue: true
      - key: FLOWSYNC_CORS_ORIGINS
        value: https://flowsync1-sec25sc020-web.onrender.com

  - type: web
    name: flowsync1-sec25sc020-web
    runtime: static
    buildCommand: npm ci --prefix frontend && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://flowsync1-sec25sc020-api.onrender.com/api
